# farm-demo web 静态站 nginx 配置（容器内）
# 覆盖 nginx:alpine 的 /etc/nginx/conf.d/default.conf

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback（当前项目无路由，为未来扩展兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # vite build 产物是 hash 文件名，长缓存安全
    location ~* \.(js|css|woff2?|png|jpg|jpeg|webp|gif|svg|glb|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # index.html 不缓存（hash 资源引用可能变）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/javascript
        application/javascript
        application/json
        text/css
        application/octet-stream
        application/wasm;
}